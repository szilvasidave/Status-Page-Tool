name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Release by hand: Actions → build → Run workflow, on the branch to release
  # (main), with the version. Creates the tag v<version> and the release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (creates the tag v<version>)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: statuspage
          POSTGRES_PASSWORD: statuspage
          POSTGRES_DB: statuspage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statuspage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STATUSPAGE_TEST_PG_DSN: postgres://statuspage:statuspage@localhost:5432/statuspage_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - name: Check the release version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The version must look like 1.2.3 or 1.2.3-rc.1, not '$VERSION'."; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "The tag v$VERSION exists already."; exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Please run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        # -p 1: the packages share the PostgreSQL test database.
        run: go test -p 1 ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then v="$VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          else v="$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: >-
          go build -trimpath
          -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}"
          -o dist/statuspage-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          ./cmd/statuspage
      - uses: actions/upload-artifact@v4
        with:
          name: statuspage-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  installer:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Version
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then v="$VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"
          else v="$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build statuspage.exe
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" -o dist/statuspage.exe ./cmd/statuspage
      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) not found" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\statuspage.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/StatusPageSetup-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build, installer]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: src
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ls -l dist
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="v$VERSION"; target=(--target "$GITHUB_SHA") # creates the tag
          else
            tag="$GITHUB_REF_NAME"; target=(--verify-tag)
          fi
          # Release notes: the section "## <version> …" of CHANGELOG.md (if
          # there is one), followed by the generated list of changes.
          awk -v v="${tag#v}" '/^## / { if (f) exit; f = ($2 == v) ; next } f' src/CHANGELOG.md > notes.md
          cat notes.md
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "Status Page ${tag#v}" --notes-file notes.md --generate-notes "${target[@]}"
