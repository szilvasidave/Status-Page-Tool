{{define "content"}}
{{with .Data}}
<section class="auth-card card">
  <div class="card-body">
    <h1>Sign in</h1>
    <p class="muted">Sign in to {{$.SiteName}}.</p>
    {{with .Error}}<div class="flash flash-error" role="alert">{{.}}</div>{{end}}

    {{if .OIDCEnabled}}
    <a class="btn btn-primary btn-block" href="/auth/oidc/login?next={{.Next}}">{{.ButtonLabel}}</a>
    {{end}}

    <details class="local-login"{{if .ShowLocal}} open{{end}}>
      <summary>{{if .OIDCEnabled}}Local administrator login{{else}}Administrator login{{end}}</summary>
      <form method="post" action="/login" class="form">
        {{template "csrf" $}}
        <input type="hidden" name="next" value="{{.Next}}">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" value="{{.Username}}" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="form-actions"><button type="submit" class="btn-primary">Sign in</button></div>
      </form>
    </details>
  </div>
</section>
{{end}}
{{end}}
